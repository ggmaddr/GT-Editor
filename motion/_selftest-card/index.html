<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #ffffff;
        --accent: #ffd23f;
        --panel: rgba(14, 14, 16, 0.86);
        --font-display: sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); }
      #card {
        position: absolute; left: 110px; top: 700px; width: 860px; padding: 48px 56px;
        background: var(--panel); border-radius: 36px; border-left: 18px solid var(--accent);
      }
      #kicker { color: var(--accent); font-size: 44px; font-weight: 800; letter-spacing: 0.08em; }
      #headline { color: var(--ink); font-size: 84px; font-weight: 900; line-height: 1.02; margin-top: 10px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.5" data-width="1080" data-height="1920">
      <div id="card" class="clip" data-start="0" data-duration="2.5" data-track-index="0">
        <div id="kicker" data-var-text="kicker">RULE #1</div>
        <div id="headline" data-var-text="headline">CUT THE DEAD AIR</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#kicker", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0.05);
      tl.fromTo("#headline", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, 0.15);
      tl.to(["#kicker", "#headline"], { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, 2.2);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
